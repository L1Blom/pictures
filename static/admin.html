<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picture Analyzer — Admin</title>
<style>
:root {
  --bg: #1e1e2e; --panel: #2a2a3a; --panel2: #32324a; --border: #44445c;
  --text: #e0e0ea; --muted: #9090a8; --accent: #7c6cf0; --ok: #4caf50;
  --warn: #ffb74d; --err: #ef5350; --mono: ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
header { background: var(--panel); padding: 10px 16px; display: flex; align-items: center;
         gap: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
header h1 { font-size: 16px; font-weight: 600; }
header .roots { font-size: 11px; color: var(--muted); font-family: var(--mono); }
header a { color: var(--accent); text-decoration: none; font-size: 12px; margin-left: auto; }

.layout { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar: folders ─────────────────────────────── */
.sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border);
           display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar .search { padding: 8px; }
.sidebar input { width: 100%; padding: 6px 10px; background: var(--panel2); color: var(--text);
                 border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
.folder-list { flex: 1; overflow-y: auto; }
.folder { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04); }
.folder:hover { background: var(--panel2); }
.folder.active { background: var(--accent); color: white; }
.folder .name { font-size: 13px; word-break: break-all; }
.folder .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.folder.active .meta { color: rgba(255,255,255,0.7); }
.folder .meta .has-desc { color: var(--ok); }

/* ── Main area ────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Command bar */
.cmd-bar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 14px;
           display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex-shrink: 0; }
.cmd-bar .folder-label { font-size: 13px; font-weight: 600; margin-right: 8px; max-width: 340px;
                         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
         background: var(--panel2); color: var(--text); font-size: 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: white; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
label.chk { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
select { padding: 5px 8px; background: var(--panel2); color: var(--text);
         border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }

/* Job bar — floats above everything (incl. viewer) so progress is always visible.
   Content below is pushed down by the bar's ACTUAL height via --jobbar-h
   (updated by JS), so multi-line job lists never overlap the header/buttons. */
.job-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 200;
          background: var(--panel); border-bottom: 1px solid var(--border); padding: 6px 14px;
          font-size: 12px; flex-shrink: 0; max-height: 120px; overflow-y: auto; display: none; }
body.has-jobs header { margin-top: var(--jobbar-h, 34px); }
body.has-jobs .viewer .top { margin-top: var(--jobbar-h, 34px); }
.job-bar .job { display: flex; gap: 10px; padding: 3px 0; font-family: var(--mono); }
.job .st-queued { color: var(--muted); } .job .st-running { color: var(--warn); }
.job .st-completed { color: var(--ok); } .job .st-failed { color: var(--err); }

/* Description editor panel */
.desc-panel { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 14px; flex-shrink: 0; display: none; }
.desc-panel.open { display: block; }
.desc-panel .desc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.desc-panel .desc-head h2 { font-size: 13px; font-weight: 600; }
.desc-panel .desc-head .status { font-size: 11px; color: var(--muted); }
.desc-panel .desc-head .status.saved { color: var(--ok); }
.desc-panel .desc-head .status.dirty { color: var(--warn); }
.desc-panel textarea { width: 100%; height: 150px; background: var(--panel2); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: var(--mono);
  font-size: 12px; resize: vertical; }
.desc-panel textarea:focus { outline: none; border-color: var(--accent); }
.desc-panel .desc-actions { display: flex; gap: 8px; margin-top: 6px; }

/* Image grid */
.grid-wrap { flex: 1; overflow-y: auto; padding: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.cell { background: var(--panel); border-radius: 8px; overflow: hidden; cursor: pointer;
        border: 2px solid transparent; }
.cell:hover { border-color: var(--accent); }
.cell img { width: 100%; height: 110px; object-fit: cover; display: block; }
.cell .cap { padding: 4px 8px; font-size: 10px; color: var(--muted);
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .badges { padding: 0 8px 6px; font-size: 9px; }
.badge { display: inline-block; padding: 1px 5px; border-radius: 4px; margin-right: 3px;
         background: var(--panel2); color: var(--muted); }
.badge.has-enh { background: #2e7d32; color: white; }
.badge.has-rest { background: #1565c0; color: white; }
.badge.gen { background: #5d4037; color: #ffe0b2; font-family: var(--mono); }
.badge.pref { background: #f9a825; color: #1e1e2e; font-weight: 600; }

/* ── Viewer overlay ───────────────────────────────── */
.viewer { position: fixed; inset: 0; background: rgba(10,10,16,0.92); z-index: 100;
          display: none; flex-direction: column; }
.viewer.open { display: flex; }
.viewer .top { padding: 10px 16px; display: flex; align-items: center; gap: 12px;
               background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.viewer .top .job-inline { font-size: 12px; font-family: var(--mono); flex-basis: 100%; order: 5; }
.viewer .top .job-inline .st-running { color: var(--warn); }
.viewer .top .job-inline .st-completed { color: var(--ok); }
.viewer .top .job-inline .st-failed { color: var(--err); }
.viewer .top .job-inline .st-queued { color: var(--muted); }
.viewer .top .title { font-size: 14px; font-weight: 600; flex: 1;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer .body { flex: 1; display: flex; overflow: hidden; }
.viewer .imgs { flex: 1.9; display: flex; flex-wrap: wrap; align-content: flex-start;
                gap: 12px; padding: 14px; overflow-y: auto; align-items: flex-start; }
.variant-card { background: var(--panel); border-radius: 8px; overflow: hidden; width: 420px; }
.variant-card img { width: 100; height: 300px; object-fit: contain; background: #111; display: block; width: 100%; }
.variant-card .vlabel { padding: 6px 10px; font-size: 12px; font-weight: 600; display: flex;
                        justify-content: space-between; align-items: center; }
.variant-card .vlabel .tag { font-size: 10px; color: var(--muted); font-weight: 400; }
.variant-card .vlabel .pick { font-size: 10px; font-weight: 400; padding: 2px 8px; border-radius: 4px;
                             border: 1px solid var(--border); background: var(--panel2); color: var(--muted);
                             cursor: pointer; }
.variant-card .vlabel .pick:hover { border-color: var(--accent); color: var(--text); }
.variant-card.preferred { border: 2px solid #f9a825; }
.variant-card.preferred .vlabel .pick { background: #f9a825; color: #1e1e2e; border-color: #f9a825; font-weight: 600; }
.viewer .json { flex: 0.85; background: var(--panel); border-left: 1px solid var(--border);
                overflow-y: auto; padding: 14px; font-family: var(--mono); font-size: 11px;
                white-space: pre-wrap; word-break: break-all; }
.viewer .json h3 { font-family: -apple-system, sans-serif; font-size: 13px; margin-bottom: 8px; }
.viewer .json .rec { padding: 4px 8px; background: var(--panel2); border-radius: 4px;
                     margin-bottom: 4px; color: var(--warn); }
.viewer .json .kv { color: var(--muted); }
.viewer .nav { display: flex; gap: 8px; }
.empty { color: var(--muted); padding: 40px; text-align: center; width: 100%; }

/* ── Zoom overlay ─────────────────────────────────── */
.zoom { position: fixed; inset: 0; background: rgba(5,5,10,0.97); z-index: 300;
         display: none; flex-direction: column; }
.zoom.open { display: flex; }
.zoom .top { padding: 8px 16px; display: flex; align-items: center; gap: 12px;
             background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.zoom .top .title { font-size: 13px; font-weight: 600; flex: 1;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.zoom .top .hint { font-size: 11px; color: var(--muted); }
.zoom .top .counter { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.zoom .top .pick { font-size: 12px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
                   background: var(--panel2); color: var(--muted); cursor: pointer; }
.zoom .top .pick:hover { border-color: var(--accent); color: var(--text); }
.zoom .top .pick.preferred { background: #f9a825; color: #1e1e2e; border-color: #f9a825; font-weight: 600; }
.zoom .stage { flex: 1; overflow: hidden; position: relative; display: flex;
               align-items: center; justify-content: center; }
.zoom .stage img { position: absolute; left: 0; top: 0; max-width: none;
                   user-select: none; -webkit-user-drag: none;
                   transform-origin: 0 0; will-change: transform; }
.zoom .stage img.grabbable { cursor: grab; }
.zoom .stage img.grabbing { cursor: grabbing; }
</style>
</head>
<body>
<header>
  <h1>⚡ Picture Analyzer Admin</h1>
  <div class="roots" id="roots"></div>
  <a href="/">← description editor</a>
  <a href="/admin" style="margin-left:0">admin →</a>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="search"><input id="folderSearch" placeholder="Filter folders…"></div>
    <div class="folder-list" id="folderList"><div class="empty">Loading folders…</div></div>
  </div>

  <div class="main">
    <div class="cmd-bar">
      <span class="folder-label" id="folderLabel">Select a folder ←</span>
      <button class="primary" id="btnProcessFolder" disabled title="Analyze + enhance + restore all images in the folder">▶ Process folder</button>
      <button id="btnAnalyzeFolder" disabled title="Analyze only (no enhance/restore)">Analyze only</button>
      <label class="chk"><input type="checkbox" id="optEnhance" checked> enhance</label>
      <label class="chk"><input type="checkbox" id="optRestore" checked> restore</label>
      <select id="optProfile" title="Restoration profile">
        <option value="auto">auto</option>
        <option>faded</option><option>color_cast</option><option>red_cast</option>
        <option>yellow_cast</option><option>aged</option><option>well_preserved</option>
      </select>
      <label class="chk"><input type="checkbox" id="optSkipExisting"> skip existing</label>
      <label class="chk" title="Show only images with a picked best variant"><input type="checkbox" id="optPicksOnly"> ★ picks only</label>
      <label class="chk" title="Toggle grid thumbnails between the original scans and the picked variants"><input type="checkbox" id="optShowPicks" checked> show picks</label>
      <button id="btnReport" disabled title="Generate markdown report">Report</button>
      <button id="btnGallery" disabled title="Generate gallery markdown">Gallery</button>
      <button id="btnPublish" disabled title="Publish this folder's picked bests into the Immich picks library">📤 Immich publish</button>
      <button id="btnSync" disabled title="Sync Immich albums with the picks library (scan + album update)">🔄 Immich sync</button>
      <button id="btnDesc" disabled title="Edit this folder's description.txt">📝 Description</button>
    </div>
    <div class="job-bar" id="jobBar"></div>
    <div class="desc-panel" id="descPanel">
      <div class="desc-head">
        <h2>📝 description.txt</h2>
        <span class="status" id="descStatus"></span>
        <button id="btnToggleDesc" style="margin-left:auto" title="Hide editor">▲ Hide</button>
      </div>
      <textarea id="descText" spellcheck="false" placeholder="Albumnaam: …"></textarea>
      <div class="desc-actions">
        <button class="primary" id="btnSaveDesc">💾 Save description</button>
        <span style="font-size:11px;color:var(--muted);align-self:center">Albumnaam determines the output folder — changing it re-routes future processing</span>
      </div>
    </div>
    <div class="grid-wrap"><div class="grid" id="grid"><div class="empty">Select a folder to see its images.</div></div></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="top">
    <div class="title" id="viewerTitle"></div>
    <div class="nav">
      <button id="btnPrevImage" title="Previous image (←)">‹</button>
      <span id="viewerCounter" style="font-size:12px;color:var(--muted);font-family:var(--mono);align-self:center"></span>
      <button id="btnNextImage" title="Next image (→)">›</button>
      <button id="btnProcessImage" class="primary">▶ Process this image</button>
      <button id="btnEnhanceImage">Enhance</button>
      <button id="btnClose">✕ Close</button>
    </div>
    <div class="job-inline" id="viewerJobLine"></div>
  </div>
  <div class="body">
    <div class="imgs" id="viewerImgs"></div>
    <div class="json" id="viewerJson"></div>
  </div>
</div>

<div class="zoom" id="zoom">
  <div class="top">
    <button id="btnZoomPrev" title="Previous variant (←)">‹</button>
    <div class="title" id="zoomTitle"></div>
    <span class="counter" id="zoomCounter"></span>
    <button id="btnZoomNext" title="Next variant (→)">›</button>
    <button id="btnZoomPick" class="pick" title="Mark this variant as the preferred picture">☆ pick best</button>
    <span class="hint">←/→ variant · scroll = zoom · drag = pan · 0 = fit · f = fill</span>
    <button id="btnZoomFit">Fit (0)</button>
    <button id="btnZoomFill">Fill (f)</button>
    <button id="btnZoomClose">✕ Close</button>
  </div>
  <div class="stage" id="zoomStage"><img id="zoomImg" alt=""></div>
</div>

<script>
const $ = id => document.getElementById(id);
let folders = [], currentFolder = null, currentImages = [], currentOutputDir = null, viewerImage = null;
let jobTimers = [];

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

/* ── Folder list ─────────────────────────────────── */
async function loadFolders() {
  try {
    const data = await api('/api/admin/folders');
    folders = data.folders;
    renderFolders('');
  } catch (e) {
    $('folderList').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function renderFolders(filter) {
  const list = folders.filter(f => f.name.toLowerCase().includes(filter.toLowerCase()));
  $('folderList').innerHTML = list.map(f => {
    const picked = f.picked || 0;
    const pickInfo = picked
      ? ` · <span style="color:#f9a825">★ ${picked}/${f.images}</span>`
      : '';
    return `
    <div class="folder ${currentFolder === f.name ? 'active' : ''}" data-folder="${escAttr(f.name)}">
      <div class="name">${esc(f.name)}</div>
      <div class="meta">${f.images} images${pickInfo} ${f.has_description ? '<span class="has-desc">· description.txt ✓</span>' : '· no description'}</div>
    </div>`;
  }).join('') || '<div class="empty">No folders match.</div>';
  document.querySelectorAll('.folder').forEach(el =>
    el.onclick = () => selectFolder(el.dataset.folder));
}

async function selectFolder(name) {
  currentFolder = name;
  renderFolders($('folderSearch').value);
  const f = folders.find(x => x.name === name);
  $('folderLabel').textContent = `${name} (${f.images} images)`;
  ['btnProcessFolder','btnAnalyzeFolder','btnReport','btnGallery','btnDesc','btnPublish','btnSync'].forEach(id => $(id).disabled = false);
  $('grid').innerHTML = '<div class="empty">Loading images…</div>';
  if ($('descPanel').classList.contains('open')) loadDescription();
  try {
    // list images via the admin dir API (also resolves the output folder)
    const resp = await api(`/api/admin/dir?dir=${encodeURIComponent(name)}`);
    currentImages = resp.images || [];
    currentOutputDir = resp.output_dir || null;
    renderGrid();
  } catch (e) {
    $('grid').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function renderGrid() {
  if (!currentImages.length) {
    $('grid').innerHTML = '<div class="empty">No images found (or folder uses unsupported formats).</div>';
    return;
  }
  const picksOnly = $('optPicksOnly').checked;
  const shown = picksOnly ? currentImages.filter(i => i.preferred_variant) : currentImages;
  if (!shown.length) {
    $('grid').innerHTML = `<div class="empty">No picks yet in this folder — pick the best variant in the image viewer.</div>`;
    return;
  }
  $('grid').innerHTML = shown.map(img => {
    const src = img.absolute || img.path;
    // "show picks" on: picked images display their picked variant's image
    // (the original is just the unprocessed scan). Off: always the original.
    const thumb = ($('optShowPicks').checked && img.thumb_src) ? img.thumb_src : src;
    const gen = img.latest_generated ? fmtDate(img.latest_generated) : null;
    return `<div class="cell" data-src="${escAttr(src)}">
      <img loading="lazy" src="/api/admin/thumb?path=${encodeURIComponent(thumb)}" onerror="this.src='/api/admin/thumb?path=${encodeURIComponent(src)}'; this.onerror=()=>this.style.opacity=0.15">
      <div class="badges">${img.has_enhanced ? '<span class="badge has-enh">enh</span>' : ''}${(img.restored_count||0) ? `<span class="badge has-rest">${img.restored_count} rest</span>` : ''}${img.preferred_variant ? `<span class="badge pref">★ ${esc(img.preferred_variant)}</span>` : ''}${gen ? `<span class="badge gen">${gen}</span>` : ''}</div>
      <div class="cap" title="${escAttr(img.name)}">${esc(img.name)}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.cell').forEach(el => el.onclick = () => openViewer(el.dataset.src));
}

/* ── Viewer ───────────────────────────────────────── */
let viewerVariants = [], viewerPreferred = null;

function viewerImageIndex() {
  // Position of the open image within the folder's image list
  return currentImages.findIndex(i => (i.absolute || i.path) === viewerImage);
}

function viewerStep(dir) {
  if (!currentImages.length || !viewerImage) return;
  const idx = viewerImageIndex();
  if (idx === -1) return;
  const next = (idx + dir + currentImages.length) % currentImages.length;
  openViewer(currentImages[next].absolute || currentImages[next].path);
}

function updateViewerCounter() {
  const idx = viewerImageIndex();
  $('viewerCounter').textContent = idx === -1 ? '' : `${idx + 1}/${currentImages.length}`;
}

async function openViewer(srcPath) {
  viewerImage = srcPath;
  $('viewer').classList.add('open');
  $('viewerTitle').textContent = srcPath.split('/').pop();
  updateViewerCounter();
  $('viewerImgs').innerHTML = '<div class="empty">Loading variants…</div>';
  $('viewerJson').innerHTML = '';
  try {
    const v = await api(`/api/admin/variants?image=${encodeURIComponent(srcPath)}`);
    // The original source is shown for reference but is NOT pickable — it
    // carries no EXIF data (no date/GPS/description), so it can't go into
    // the Immich album. Only processed variants are candidates.
    const variants = [];
    if (v.analyzed) variants.push({label: 'Analyzed (untouched copy)', path: v.analyzed, key: 'analyzed', gen: v.analyzed_generated});
    if (v.enhanced) variants.push({label: 'Enhanced (AI recommendations)', path: v.enhanced, key: 'enhanced', gen: v.enhanced_generated});
    for (const r of v.restored) variants.push({label: `Restored: ${r.profile}`, path: r.path, key: `restored:${r.profile}`, gen: r.generated});
    if (variants.length) variants.unshift({label: 'Original (source, no EXIF — reference only)', path: srcPath, key: null});
    viewerVariants = variants;
    viewerPreferred = v.preferred_variant;
    $('viewerImgs').innerHTML = variants.map((vv, i) => variantCard(vv, i)).join('')
      || '<div class="empty">No variants yet — process the image.</div>';
    document.querySelectorAll('.variant-card .pick').forEach(btn =>
      btn.onclick = () => setPreferred(viewerImage, btn.dataset.variant));
    document.querySelectorAll('.variant-card img').forEach(img =>
      img.onclick = () => openZoom(+img.dataset.vindex, true));
    if (v.analysis_json) loadAnalysis(v.analysis_json);
    else $('viewerJson').innerHTML = '<h3>Analysis</h3><div class="kv">No analysis JSON found.</div>';
  } catch (e) {
    $('viewerImgs').innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

async function setPreferred(srcPath, variant) {
  // Toggle: clicking the already-preferred variant unpicks it (variant=null clears)
  if (viewerPreferred === variant) variant = null;
  try {
    await api('/api/admin/preferred', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ image: srcPath, variant }) });
    viewerPreferred = variant;
    refreshPreferredUI();
    if (currentFolder) selectFolder(currentFolder); // refresh grid badge
  } catch (e) {
    alert('Could not save preference: ' + e.message);
  }
}

function refreshPreferredUI() {
  // Viewer cards (the original's card has no pick button — skip it)
  document.querySelectorAll('.variant-card').forEach(card => {
    const b = card.querySelector('.pick');
    if (!b) return;
    const isPref = b.dataset.variant === viewerPreferred;
    card.classList.toggle('preferred', isPref);
    b.textContent = isPref ? '★ preferred' : '☆ pick';
  });
  // Zoom bar (when open)
  if ($('zoom').classList.contains('open')) updateZoomPick();
}

function variantCard(vv, i) {
  const gen = vv.gen ? `<span class="tag">${fmtDate(vv.gen)}</span>` : '';
  const isPref = viewerPreferred === vv.key;
  const pickBtn = vv.key
    ? `<button class="pick" data-variant="${escAttr(vv.key)}">${isPref ? '★ preferred' : '☆ pick'}</button>`
    : '';  // original: reference only, not pickable (no EXIF)
  return `<div class="variant-card ${isPref ? 'preferred' : ''}">
    <div class="vlabel"><span>${esc(vv.label)}</span>${gen}${pickBtn}</div>
    <img src="/api/admin/file?path=${encodeURIComponent(vv.path)}" loading="lazy" data-vindex="${i}">
  </div>`;
}

async function loadAnalysis(jsonPath) {
  try {
    const r = await fetch(`/api/admin/file?path=${encodeURIComponent(jsonPath)}`);
    const d = await r.json();
    const recs = (d.enhancement && d.enhancement.recommended_enhancements) || [];
    const profiles = d.slide_profiles || [];
    const loc = d.location_detection || {};
    $('viewerJson').innerHTML = `
      <h3>Analysis</h3>
      <div class="kv">Date: ${esc(d.date_taken || '?')}</div>
      <div class="kv">Location: ${esc([loc.city_or_area, loc.region, loc.country].filter(Boolean).join(', ') || '?')} (${loc.confidence ?? '?'}%)</div>
      <div class="kv">Objects: ${esc((d.metadata||{}).objects || '?')}</div>
      <div class="kv">Persons: ${esc((d.metadata||{}).persons || '?')}</div>
      <h3 style="margin-top:12px">Enhancement recommendations</h3>
      ${recs.map(r => `<div class="rec">${esc(r)}</div>`).join('') || '<div class="kv">none</div>'}
      <h3 style="margin-top:12px">Slide profiles</h3>
      ${profiles.map(p => `<div class="rec">${esc(p.profile)} (${p.confidence}%)</div>`).join('') || '<div class="kv">none</div>'}
      <h3 style="margin-top:12px">Full JSON</h3>
      <div class="kv">${esc(JSON.stringify(d, null, 2))}</div>`;
  } catch (e) {
    $('viewerJson').innerHTML = `<div class="kv">Could not load analysis: ${e.message}</div>`;
  }
}

/* ── Description editor ────────────────────────────── */
let descLoaded = '', descDirty = false;

async function loadDescription() {
  if (!currentFolder) return;
  try {
    const d = await api(`/api/admin/description?dir=${encodeURIComponent(currentFolder)}`);
    $('descText').value = d.description;
    descLoaded = d.description;
    descDirty = false;
    $('descStatus').textContent = d.exists ? 'existing file' : 'new file (template)';
    $('descStatus').className = 'status';
  } catch (e) {
    $('descStatus').textContent = 'error: ' + e.message;
    $('descStatus').className = 'status dirty';
  }
}

async function saveDescription() {
  if (!currentFolder) return;
  const btn = $('btnSaveDesc');
  btn.disabled = true;
  try {
    await api('/api/admin/description', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ dir: currentFolder, description: $('descText').value }) });
    descLoaded = $('descText').value;
    descDirty = false;
    $('descStatus').textContent = 'saved ✓';
    $('descStatus').className = 'status saved';
    // Notify: the folder list and grid are about to refresh (Albumnaam
    // changes re-route the output folder, so the view must follow).
    showSyncStatus('Description saved — refreshing folder view', true, currentFolder);
    // Refresh folder list (has_description flag) and grid (output dir may
    // change if Albumnaam was edited)
    await loadFolders();
    if (currentFolder) await selectFolder(currentFolder);
  } catch (e) {
    $('descStatus').textContent = 'error: ' + e.message;
    $('descStatus').className = 'status dirty';
  } finally {
    btn.disabled = false;
  }
}

function toggleDescPanel(show) {
  const panel = $('descPanel');
  const open = show !== undefined ? show : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  if (open) loadDescription();
}

$('btnDesc').onclick = () => toggleDescPanel();
$('btnToggleDesc').onclick = () => toggleDescPanel(false);
$('btnSaveDesc').onclick = saveDescription;
$('descText').oninput = () => {
  descDirty = true;
  $('descStatus').textContent = 'unsaved changes';
  $('descStatus').className = 'status dirty';
};

/* ── Commands ─────────────────────────────────────── */
function showJobBar() {
  const bar = $('jobBar');
  bar.style.display = 'block';
  document.body.classList.add('has-jobs');
  updateJobBarHeight();
}

function updateJobBarHeight() {
  const bar = $('jobBar');
  if (bar.style.display === 'none') return;
  document.documentElement.style.setProperty('--jobbar-h', bar.offsetHeight + 'px');
  // Mirror the latest job line into the viewer so progress stays visible
  // while browsing pictures (the floating bar can be crowded out visually).
  const inline = document.getElementById('viewerJobLine');
  if (inline) {
    const lines = bar.querySelectorAll('.job span');
    const last = lines[lines.length - 1];
    inline.innerHTML = last ? last.outerHTML : '';
  }
}

// Keep the pushed-down offset in sync whenever the bar grows/shrinks
new ResizeObserver(updateJobBarHeight).observe(document.getElementById('jobBar'));

function startJobPolling(jobId, label) {
  showJobBar();
  const bar = $('jobBar');
  const el = document.createElement('div');
  el.className = 'job';
  el.innerHTML = `<span class="st-queued" id="job-${jobId}">⏳ ${esc(label)} — queued</span>`;
  bar.appendChild(el);
  updateJobBarHeight();
  const timer = setInterval(async () => {
    try {
      const j = await api(`/api/jobs/${jobId}`);
      const span = document.getElementById(`job-${jobId}`);
      if (!span) { clearInterval(timer); return; }
      span.className = `st-${j.status}`;
      span.textContent = j.status === 'running' ? `🔄 ${label} — running…`
        : j.status === 'completed' ? `✓ ${label} — completed`
        : `✗ ${label} — failed`;
      if (j.status === 'completed' || j.status === 'failed') {
        clearInterval(timer);
        if (j.error) span.title = j.error;
        if (viewerImage) openViewer(viewerImage); // refresh viewer
        if (currentFolder) selectFolder(currentFolder); // refresh grid
      }
    } catch (e) { /* keep polling */ }
  }, 2000);
  jobTimers.push(timer);
}

function showSyncStatus(label, ok, detail) {
  return finishSyncStatus(null, label, ok, detail);
}

function showRunning(label) {
  showJobBar();
  const bar = $('jobBar');
  const el = document.createElement('div');
  el.className = 'job';
  el.innerHTML = `<span class="st-running">🔄 ${esc(label)} — running…</span>`;
  bar.appendChild(el);
  updateJobBarHeight();
  return el;
}

function finishSyncStatus(existingLine, label, ok, detail) {
  showJobBar();
  const bar = $('jobBar');
  const el = existingLine || document.createElement('div');
  el.className = 'job';
  el.innerHTML = `<span class="st-${ok ? 'completed' : 'failed'}">${ok ? '✓' : '✗'} ${esc(label)} — ${ok ? 'completed' : 'failed'}${detail ? ' · ' + esc(detail) : ''}</span>`;
  if (!existingLine) bar.appendChild(el);
  updateJobBarHeight();
  if (ok) {
    if (viewerImage) openViewer(viewerImage);   // refresh viewer
    if (currentFolder) selectFolder(currentFolder); // refresh grid
  }
  return el;
}

async function runCommand(kind) {
  if (!currentFolder) return;
  const f = folders.find(x => x.name === currentFolder);
  const doEnh = $('optEnhance').checked, doRestore = $('optRestore').checked;
  const profile = $('optProfile').value, skip = $('optSkipExisting').checked;
  let body, endpoint, label;
  if (kind === 'folder-process') {
    endpoint = '/api/analyze/batch';
    body = { directory: f.path, enhance: doEnh, restore_slide: doRestore ? profile : null, skip_existing: skip };
    label = `Process ${currentFolder}`;
  } else if (kind === 'folder-analyze') {
    endpoint = '/api/analyze/batch';
    body = { directory: f.path, enhance: false, restore_slide: null, skip_existing: skip };
    label = `Analyze ${currentFolder}`;
  } else if (kind === 'immich-publish') {
    if (!currentFolder) return;
    const r = await api('/api/admin/immich/publish', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ dir: currentFolder }) });
    // Show the ALBUM name (Albumnaam) — the picks land there, which may
    // differ from the source folder name.
    showSyncStatus(`Immich publish → ${r.album}`, true,
      `${r.published} published · ${r.skipped} no pick yet${r.errors.length ? ` · ${r.errors.length} errors` : ''}`);
    return;
  } else if (kind === 'immich-sync') {
    endpoint = '/api/admin/immich/sync';
    body = { scan: true };
    label = `Immich sync`;
  } else if (kind === 'report') {
    if (!currentOutputDir) { alert('Select a folder first.'); return; }
    const r = await api('/api/report', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ directory: currentOutputDir }) });
    showSyncStatus('Report ' + currentFolder, true, r.report_path); return;
  } else if (kind === 'gallery') {
    if (!currentOutputDir) { alert('Select a folder first.'); return; }
    const r = await api('/api/gallery', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ directory: currentOutputDir }) });
    showSyncStatus('Gallery ' + currentFolder, true, r.report_path); return;
  } else if (kind === 'image-process') {
    endpoint = '/api/process';
    body = { image: viewerImage, restore_slide: doRestore ? profile : null };
    label = `Process ${viewerImage.split('/').pop()}`;
  } else if (kind === 'image-enhance') {
    endpoint = '/api/enhance';
    body = { image: viewerImage };
    label = `Enhance ${viewerImage.split('/').pop()}`;
  }
  // Show a running line immediately for synchronous commands (enhance/
  // report/gallery block on the request — without this, nothing is visible
  // between the click and the result).
  const isSync = kind === 'image-enhance' || kind === 'report' || kind === 'gallery';
  let syncLine = null;
  if (isSync) syncLine = showRunning(label);

  try {
    const r = await api(endpoint, { method: 'POST', headers: {'Content-Type':'application/json'},
                                   body: JSON.stringify(body) });
    if (r.job_id) {
      // Async command — poll the job queue
      startJobPolling(r.job_id, label);
      if (syncLine) syncLine.remove();
    } else {
      // Synchronous command (enhance) — completed; update the running line
      finishSyncStatus(syncLine, label, true, r.output ? r.output.split('/').pop() : null);
    }
  } catch (e) {
    finishSyncStatus(syncLine, label, false, e.message);
  }
}

/* ── Utils ────────────────────────────────────────── */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }function fmtDate(unixTs) {
  const d = new Date(unixTs * 1000);
  const now = new Date();
  const hm = d.toTimeString().substring(0, 5);
  if (d.toDateString() === now.toDateString()) return `vandaag ${hm}`;
  const day = d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  return `${day} ${hm}`;
}
/* ── Wire up ──────────────────────────────────────── */
$('folderSearch').oninput = e => renderFolders(e.target.value);
$('optPicksOnly').onchange = () => renderGrid();
$('optShowPicks').onchange = () => renderGrid();
$('btnProcessFolder').onclick = () => runCommand('folder-process');
$('btnAnalyzeFolder').onclick = () => runCommand('folder-analyze');
$('btnReport').onclick = () => runCommand('report');
$('btnGallery').onclick = () => runCommand('gallery');
$('btnPublish').onclick = () => runCommand('immich-publish');
$('btnSync').onclick = () => runCommand('immich-sync');
$('btnProcessImage').onclick = () => runCommand('image-process');
$('btnEnhanceImage').onclick = () => runCommand('image-enhance');
$('btnPrevImage').onclick = () => viewerStep(-1);
$('btnNextImage').onclick = () => viewerStep(1);
$('btnClose').onclick = () => { $('viewer').classList.remove('open'); viewerImage = null; };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('zoom').classList.contains('open')) $('btnClose').click();
});

// Arrow keys navigate images in the viewer — but while the zoom overlay is
// open, ←/→ belong to the zoom's variant loop instead.
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if ($('zoom').classList.contains('open')) return;   // zoom owns the arrows
  if (!$('viewer').classList.contains('open')) return;
  viewerStep(e.key === 'ArrowLeft' ? -1 : 1);
});

/* ── Zoom overlay ──────────────────────────────────── */
/* Full-screen inspection of one variant. Opens in Fit mode (whole image
   visible); Fill (f) scales to fill the dominant dimension (landscape →
   width, portrait → height). While zoomed, ←/→ loops through the variants
   of this image KEEPING the current zoom and pan — so you can compare the
   same detail across variants — and the pick button marks the preferred
   variant for the Immich album. */
let zoomNatW = 0, zoomNatH = 0, zoomScale = 1, zoomX = 0, zoomY = 0;
let zoomIndex = 0, zoomMode = 'fit';

function openZoom(index, fresh) {
  if (fresh) zoomMode = 'fit';   // default: whole image visible
  zoomIndex = index;
  showZoomVariant();
  $('zoom').classList.add('open');
}

function zoomStep(dir) {
  if (!viewerVariants.length) return;
  zoomIndex = (zoomIndex + dir + viewerVariants.length) % viewerVariants.length;
  showZoomVariant();
}

function showZoomVariant() {
  const vv = viewerVariants[zoomIndex];
  if (!vv) return;
  $('zoomTitle').textContent = vv.label;
  $('zoomCounter').textContent = `${zoomIndex + 1}/${viewerVariants.length}`;
  updateZoomPick();
  const img = $('zoomImg');
  img.onload = () => {
    zoomNatW = img.naturalWidth; zoomNatH = img.naturalHeight;
    if (zoomMode === 'fit') zoomFit();
    else if (zoomMode === 'fill') zoomFill();
    else applyZoom();   // custom zoom: keep position — compare the same detail
  };
  img.src = `/api/admin/file?path=${encodeURIComponent(vv.path)}`;
}

function updateZoomPick() {
  const vv = viewerVariants[zoomIndex];
  const b = $('btnZoomPick');
  if (!vv || !vv.key) {
    // Original source: reference only — no pick button in the zoom bar
    b.style.display = 'none';
    return;
  }
  b.style.display = '';
  const isPref = viewerPreferred === vv.key;
  b.textContent = isPref ? '★ preferred' : '☆ pick best';
  b.classList.toggle('preferred', isPref);
}

function closeZoom() { $('zoom').classList.remove('open'); }

function zoomFit() {
  // Whole image visible, centered
  zoomMode = 'fit';
  const stage = $('zoomStage');
  const s = Math.min(stage.clientWidth / zoomNatW, stage.clientHeight / zoomNatH);
  zoomScale = s;
  zoomX = (stage.clientWidth - zoomNatW * s) / 2;
  zoomY = (stage.clientHeight - zoomNatH * s) / 2;
  applyZoom();
}

function zoomFill() {
  // Fill the dominant dimension: landscape → width, portrait → height
  zoomMode = 'fill';
  const stage = $('zoomStage');
  const landscape = zoomNatW >= zoomNatH;
  zoomScale = landscape ? stage.clientWidth / zoomNatW : stage.clientHeight / zoomNatH;
  zoomX = (stage.clientWidth - zoomNatW * zoomScale) / 2;
  zoomY = (stage.clientHeight - zoomNatH * zoomScale) / 2;
  applyZoom();
}

function applyZoom() {
  const img = $('zoomImg');
  img.style.transform = `translate(${zoomX}px, ${zoomY}px) scale(${zoomScale})`;
  img.classList.toggle('grabbable', zoomScale > Math.min(
    $('zoomStage').clientWidth / zoomNatW, $('zoomStage').clientHeight / zoomNatH) + 0.001);
}

function clampPan() {
  // Keep the image from being dragged fully off-screen: at least a
  // 100px slice stays visible on each axis when the image is larger
  // than the stage; when smaller, keep it centered.
  const stage = $('zoomStage');
  const w = zoomNatW * zoomScale, h = zoomNatH * zoomScale;
  if (w <= stage.clientWidth) zoomX = (stage.clientWidth - w) / 2;
  else zoomX = Math.min(0, Math.max(stage.clientWidth - w, zoomX));
  if (h <= stage.clientHeight) zoomY = (stage.clientHeight - h) / 2;
  else zoomY = Math.min(0, Math.max(stage.clientHeight - h, zoomY));
}

(function initZoom() {
  const stage = $('zoomStage'), img = $('zoomImg');

  $('btnZoomClose').onclick = closeZoom;
  $('btnZoomFit').onclick = zoomFit;
  $('btnZoomFill').onclick = zoomFill;
  $('btnZoomPrev').onclick = () => zoomStep(-1);
  $('btnZoomNext').onclick = () => zoomStep(1);
  $('btnZoomPick').onclick = () => {
    const vv = viewerVariants[zoomIndex];
    if (vv && vv.key) setPreferred(viewerImage, vv.key);  // original (key=null) is not pickable
  };

  // Wheel: zoom around the cursor position
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
    const ns = Math.min(Math.max(zoomScale * factor, 0.05), 40);
    // Keep the point under the cursor fixed while zooming
    zoomX = cx - (cx - zoomX) * (ns / zoomScale);
    zoomY = cy - (cy - zoomY) * (ns / zoomScale);
    zoomScale = ns;
    zoomMode = 'custom';
    applyZoom();
  }, { passive: false });

  // Drag to pan
  let dragging = false, lastX = 0, lastY = 0;
  img.addEventListener('mousedown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    img.classList.add('grabbing'); e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    zoomX += e.clientX - lastX; zoomY += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    zoomMode = 'custom';
    clampPan();
    applyZoom();
  });
  window.addEventListener('mouseup', () => {
    dragging = false; img.classList.remove('grabbing');
  });

  // Touch: pinch zoom + pan
  let pinchDist = 0;
  stage.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
    } else if (e.touches.length === 1) {
      dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    }
  }, { passive: true });
  stage.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist > 0) {
      e.preventDefault();
      const d = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      const rect = stage.getBoundingClientRect();
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      const ns = Math.min(Math.max(zoomScale * (d / pinchDist), 0.05), 40);
      zoomX = cx - (cx - zoomX) * (ns / zoomScale);
      zoomY = cy - (cy - zoomY) * (ns / zoomScale);
      zoomScale = ns;
      zoomMode = 'custom';
      applyZoom();
      pinchDist = d;
    } else if (e.touches.length === 1 && dragging) {
      e.preventDefault();
      zoomX += e.touches[0].clientX - lastX;
      zoomY += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      clampPan();
      applyZoom();
    }
  }, { passive: false });
  stage.addEventListener('touchend', () => { dragging = false; pinchDist = 0; });

  // Keyboard: ←/→ loop variants, 0 = fit, f = fill, Escape closes zoom
  document.addEventListener('keydown', e => {
    if (!$('zoom').classList.contains('open')) return;
    if (e.key === '0') zoomFit();
    else if (e.key === 'f' || e.key === 'F') zoomFill();
    else if (e.key === 'ArrowLeft') zoomStep(-1);
    else if (e.key === 'ArrowRight') zoomStep(1);
    else if (e.key === 'Escape') closeZoom();
  });

  // Keep the view coherent when the window is resized
  window.addEventListener('resize', () => {
    if (!$('zoom').classList.contains('open')) return;
    if (zoomMode === 'fit') zoomFit();
    else if (zoomMode === 'fill') zoomFill();
    else { clampPan(); applyZoom(); }
  });
})();

loadFolders();
api('/api/admin/roots').then(r => {
  $('roots').textContent = `photos: ${r.photos_root}  ·  enhanced: ${r.enhanced_root}`;
}).catch(() => {});
</script>
