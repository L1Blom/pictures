# Slide restoration profile: Color Cast
# For slides with general color cast issues (any unusual color tint)
# Tuned 2026-09-19 per enhancement-quality audit (audit_output/audit_report.md):
# previous values never won a blind ranking under either judging style.
name: Color Cast
description: For slides with general color cast issues

saturation: 1.15
contrast: 1.2
brightness: 1.06
sharpness: 1.08

color_balance:
  red: 1.0
  green: 1.03
  blue: 0.97

denoise: true
denoise_radius: 0.5
