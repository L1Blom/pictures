# Runtime configuration for picture-analyzer
# This file targets local Ollama with per-step model overrides.

analyzer_provider: "ollama"

ollama:
  model: "ministral-3:3b"           # fallback when no per-step model is set
  host: "http://127.0.0.1:11434"
  docker_host: "http://127.0.0.1:11434"  # same as host because container uses network_mode: host
  #host: "http://192.168.2.66:11434"
  max_tokens: 8192
  timeout: 1200                           # seconds per step; CPU inference + cold reload can take 15+ min
  num_ctx: 8192                          # KV-cache context window; mllama images use ~8000 tokens alone
  keep_alive: 3600                       # seconds to keep model loaded between images (0 = unload after each call)

pipeline:
  mode: stepped
  # Max concurrent LLM steps within one image. Steps with no unmet dependencies
  # run in parallel via a ThreadPoolExecutor. Should match Ollama's
  # OLLAMA_NUM_PARALLEL (set in the ollama.service unit) for best throughput.
  parallel_workers: 4
  metadata:
    model: "ministral-3:3b"         # Large vision model with better visual reasoning
  location:
    model: "ministral-3:3b"         # vision model; geographic reasoning from visual clues
  enhancement:
    model: "ministral-3:3b"         # vision model; analyzes image quality for enhancement recommendations
    max_tokens: 1024               # enhancement JSON is small; cap to prevent runaway loops
    num_ctx: 8192                  # prompt is ~3800 tokens; 4096 leaves only ~300 for response → truncation
  slide_profiles:
    model: "ministral-3:3b"         # vision model; detects scan/slide degradation patterns
    max_tokens: 512                # slide profile JSON is tiny

openai:
  # Kept for compatibility when switching providers.
  model: "gpt-4o-mini"
  max_tokens: 4096
  detail: "auto"

metadata:
  language: "nl"

geo:
  provider: "nominatim"
  confidence_threshold: 80

output:
  directory: "output"
  enhanced_root: "/home/leen/bigfoot/NieuwVolume/enhanced"
  docker_enhanced_root: "/data/enhanced"  # used automatically when running inside Docker

batch_size: 5
log_level: "INFO"

# Immich album publishing (publish-immich / sync-immich commands)
# api_key is a secret — set it via .env (PA_IMMICH__API_KEY=...) instead of here.
immich:
  url: "http://127.0.0.1:2283"
  picks_root: "/home/leen/bigfoot/NieuwVolume/picks"   # host path of the picks external library
  immich_picks_root: "/import/picks"
